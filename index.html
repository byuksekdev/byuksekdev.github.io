      try {
        var q = location.search;
        if (/[?&]notrack(=|&|$)/.test(q)) localStorage.setItem('umami.disabled', '1');
        else if (/[?&]track(=|&|$)/.test(q)) localStorage.removeItem('umami.disabled');

      } catch (e) {}
    </script>
